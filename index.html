<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geografías del comercio tradicional - Castellón de la Plana</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts - Barlow -->
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #1db3e2;
            --secondary-color: #0a9ec6;
            --dark-blue: #212c37;
            --light-grey: #f5f5f5;
            --medium-grey: #666;
            --dark-grey: #333;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Barlow', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: var(--light-grey);
            overflow: auto;
        }

        /* ---- Header ---- */
        .header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 60px;
            background-color: var(--dark-blue);
            color: white;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .header .logo { display: flex; align-items: center; gap: 10px; }
        .header .logo h1 { font-size: 20px; font-weight: 900; color: white; margin-left: 10px; }
        .header .nav-links a {
            color: white; text-decoration: none;
            margin-left: 20px; font-weight: 700; font-size: 14px;
        }

        /* ---- Layout ---- */
        #landing-page {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .landing-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 24px 60px;
        }

        .landing-logo {
            margin-bottom: 40px;
        }

        .landing-logo img {
            max-width: 300px;
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        .btn-map {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 32px;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            border-radius: 4px;
            transition: background-color 0.3s ease;
        }

        .btn-map:hover {
            background-color: var(--secondary-color);
        }

        footer {
            background-color: var(--dark-blue);
            color: white;
            padding: 40px 24px;
            margin-top: auto;
            text-align: center;
            border-top: 2px solid var(--primary-color);
            width: 100%;
            flex-shrink: 0;
        }

        footer p {
            color: rgba(255, 255, 255, 0.9);
            margin: 8px 0;
            font-size: 14px;
            line-height: 1.6;
        }

        footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 700;
        }

        footer a:hover {
            text-decoration: underline;
        }

        footer .footer-links {
            margin-top: 20px;
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        footer .footer-links a {
            font-size: 13px;
        }

        @media (max-width: 768px) {
            .landing-logo img {
                max-width: 200px;
            }
        }
    </style>
</head>
<body>
    <div id="landing-page">

        <!-- Header -->
        <header class="header">
            <div class="logo">
                <i class="fas fa-map-marked-alt" style="font-size: 28px;"></i>
                <h1>Geografías del comercio tradicional - Castellón de la Plana</h1>
            </div>
            <nav class="nav-links">
                <a href="mapa.html">Mapa</a>
                <a href="proyecto.html">Proyecto</a>
                <a href="contactos.html">Contactos</a>
            </nav>
        </header>

        <!-- Contenido -->
        <main class="landing-content">
            <div class="landing-logo">
                <img src="./images/logo4.png" alt="Geografías del comercio tradicional">
            </div>
            <a class="btn-map" href="mapa.html">
                <i class="fas fa-map"></i> Mapa
            </a>
        </main>

        <!-- Footer -->
        <footer>
            <p><strong>Geografías del comercio tradicional</strong></p>
            <p>Memoria, transformación y paisajes relacionales en Castellón de la Plana</p>
            <p style="margin-top: 20px; font-size: 13px; opacity: 0.8;">
                © 2026 · Proyecto de investigación y documentación
            </p>
            <div class="footer-links">
                <a href="mapa.html">Mapa</a>
                <a href="proyecto.html">Proyecto</a>
                <a href="https://github.com/patrunomeister/MapaComercioTradicional" target="_blank" rel="noopener">Repositorio</a>
            </div>
        </footer>

    </div><!-- #landing-page -->
</body>
</html>
